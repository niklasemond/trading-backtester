name: temporary-historical-preset-calibration
on:
  push:
    branches:
      - historical-preset-calibration

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[api,dev]" httpx2
      - name: Calibrate SMA examples
        run: |
          python - <<'PY'
          import asyncio, json
          from datetime import date, timedelta
          from itertools import product

          from backtest_app.analytics.engine import analyze_backtest
          from backtest_app.domain.experiment import BacktestConfig, CostModel
          from backtest_app.domain.strategy import (
              ComparisonCondition, CrossoverCondition, IndicatorRef, PriceRef,
              SmaIndicator, StrategySpec,
          )
          from backtest_app.execution.engine import run_backtest
          from backtest_app.market_data.provider import MarketDataRequest
          from backtest_app.market_data.yahoo import YahooFinanceProvider

          START=date(2000,1,3)
          END=date(2025,12,31)
          FAST=(5,10,20,30,50,75,100)
          SLOW=(50,75,100,150,200,250,300)
          COST=CostModel(slippage_bps=5)

          def strategy(fast, slow, trend):
              f=IndicatorRef(id="fast"); s=IndicatorRef(id="slow")
              entry=[CrossoverCondition(left=f,operator="crosses_above",right=s)]
              if trend:
                  entry.append(ComparisonCondition(left=PriceRef(),operator="above",right=s))
              return StrategySpec(
                  schema_version="1.1",
                  name=f"SPY {fast}/{slow}{' trend' if trend else ''}",
                  symbols=("SPY",),
                  indicators=(SmaIndicator(id="fast",window=fast),SmaIndicator(id="slow",window=slow)),
                  entry_conditions=tuple(entry),
                  exit_conditions=(CrossoverCondition(left=f,operator="crosses_below",right=s),),
                  entry_logic="all",
                  exit_logic="all",
              )

          async def main():
              provider=YahooFinanceProvider()
              data=await provider.get_history(MarketDataRequest(
                  symbol="SPY",
                  start_date=START-timedelta(days=700),
                  end_date=END,
              ))
              cfg=BacktestConfig(start_date=START,end_date=END,starting_capital=100000,costs=COST)
              rows=[]
              benchmark=None
              for f,sl,tr in product(FAST,SLOW,(False,True)):
                  if f>=sl: continue
                  st=strategy(f,sl,tr)
                  result=run_backtest(st,cfg,data)
                  analysis=analyze_backtest(result,st,cfg,data)
                  m=analysis.strategy_metrics
                  b=analysis.benchmark_metrics
                  benchmark=b
                  rows.append({
                    "fast":f,"slow":sl,"trend":tr,
                    "return":m.total_return,
                    "excess":m.total_return-b.total_return,
                    "sharpe":m.sharpe_ratio,
                    "drawdown":m.max_drawdown,
                    "trades":m.number_of_trades,
                  })
              rows.sort(key=lambda x:x["excess"])
              print("BENCHMARK",json.dumps(benchmark.model_dump()))
              print("BOTTOM")
              for r in rows[:8]: print(json.dumps(r,sort_keys=True))
              print("MIDDLE")
              mid=len(rows)//2
              for r in rows[mid-4:mid+4]: print(json.dumps(r,sort_keys=True))
              print("TOP")
              for r in rows[-12:]: print(json.dumps(r,sort_keys=True))
          asyncio.run(main())
          PY
