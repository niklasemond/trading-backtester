name: temporary-daily-bar-validation
on:
  push:
    branches:
      - audit-daily-bar-test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[api,dev]" httpx2
      - run: python -m pytest
