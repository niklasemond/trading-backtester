name: temporary-backtest-preset-validation
on:
  push:
    branches:
      - backtest-presets-test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[api,dev]" httpx2
      - run: python -m pytest
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("src/backtest_app/web/index.html").read_text()
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/backtester.js").write_text(script)
          PY
          node --check /tmp/backtester.js
