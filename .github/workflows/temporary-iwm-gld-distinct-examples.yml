name: temporary-iwm-gld-distinct-examples
on:
  push:
    branches:
      - iwm-gld-example-detail
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[api,dev]" httpx2
      - run: |
          python - <<'PY'
          import asyncio, json
          from datetime import date, timedelta
          from itertools import product
          from backtest_app.analytics.engine import analyze_backtest
          from backtest_app.domain.experiment import BacktestConfig, CostModel
          from backtest_app.domain.strategy import ComparisonCondition, CrossoverCondition, IndicatorRef, PriceRef, SmaIndicator, StrategySpec
          from backtest_app.execution.engine import run_backtest
          from backtest_app.market_data.provider import MarketDataRequest
          from backtest_app.market_data.yahoo import YahooFinanceProvider
          START=date(2008,1,2); END=date(2025,12,31)
          FAST=(5,10,20,30,50,75,100); SLOW=(50,75,100,150,200,250,300)
          async def main():
              p=YahooFinanceProvider()
              for symbol in ("IWM","GLD"):
                  data=await p.get_history(MarketDataRequest(symbol=symbol,start_date=START-timedelta(days=700),end_date=END))
                  cfg=BacktestConfig(start_date=START,end_date=END,starting_capital=100000,costs=CostModel(slippage_bps=5))
                  rows=[]
                  for f,sl,tr in product(FAST,SLOW,(False,True)):
                      if f>=sl: continue
                      a=IndicatorRef(id="fast"); b=IndicatorRef(id="slow")
                      entry=[CrossoverCondition(left=a,operator="crosses_above",right=b)]
                      if tr: entry.append(ComparisonCondition(left=PriceRef(),operator="above",right=b))
                      s=StrategySpec(schema_version="1.1",name="detail",symbols=(symbol,),indicators=(SmaIndicator(id="fast",window=f),SmaIndicator(id="slow",window=sl)),entry_conditions=tuple(entry),exit_conditions=(CrossoverCondition(left=a,operator="crosses_below",right=b),),entry_logic="all",exit_logic="all")
                      an=analyze_backtest(run_backtest(s,cfg,data),s,cfg,data)
                      m=an.strategy_metrics; bm=an.benchmark_metrics
                      rows.append({"fast":f,"slow":sl,"trend":tr,"return":m.total_return,"excess":m.total_return-bm.total_return,"sharpe":m.sharpe_ratio,"drawdown":m.max_drawdown,"trades":m.number_of_trades})
                  rows.sort(key=lambda r:r["excess"],reverse=True)
                  print("DETAIL",json.dumps({"symbol":symbol,"top5":rows[:5]},sort_keys=True))
          asyncio.run(main())
          PY
