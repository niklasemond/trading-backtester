<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Trading Backtester</title>
<style>body{font:14px system-ui;margin:0;background:#f4f5f7;color:#111}header{background:#111827;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:20px}.box{background:white;padding:16px;margin:14px 0;border:1px solid #ddd;border-radius:10px}form,.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}label{display:grid;gap:5px}input,select,button{padding:9px;border:1px solid #bbb;border-radius:6px}button{background:#111827;color:white;font-weight:bold}.metrics{grid-template-columns:repeat(6,1fr)}.metric{border:1px solid #ddd;padding:10px;border-radius:7px}.metric small{display:block;color:#666}canvas{width:100%;height:320px}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:right}td:first-child,th:first-child{text-align:left}.error{color:#b91c1c}@media(max-width:800px){form,.metrics{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><header><h1>Trading Backtester</h1><div>Daily, long-only research with next-bar execution.</div></header><main>
<section class="box"><form id="backtest-form">
<label>Symbol<input id="symbol" value="SPY"></label><label>Fast SMA<input id="fast" type="number" value="20" min="1"></label><label>Slow SMA<input id="slow" type="number" value="50" min="2"></label><label>Provider<select id="provider"><option value="yahoo">Yahoo Finance</option></select></label>
<label>Start<input id="start" type="date" value="2018-01-01"></label><label>End<input id="end" type="date" value="2025-12-31"></label><label>Capital<input id="capital" type="number" value="100000" min="1"></label><label>Commission<input id="commission" type="number" value="0" min="0" step="0.01"></label>
<label>Slippage (bps)<input id="slippage" type="number" value="0" min="0"></label><label>Cash buffer (%)<input id="buffer" type="number" value="0" min="0" max="99"></label><label>Fractional<select id="fractional"><option value="false">No</option><option value="true">Yes</option></select></label><button id="run">Run backtest</button>
</form><p id="status">Ready.</p><small>Signals use the close and execute at the next available open. SMA warm-up history is fetched automatically before the selected start date.</small></section>
<section id="results" class="box" hidden><div id="metrics" class="metrics"></div></section><section id="chartbox" class="box" hidden><canvas id="chart"></canvas></section>
<section id="tradebox" class="box" hidden><h2>Trade history</h2><table><thead><tr><th>Side</th><th>Executed</th><th>Price</th><th>Qty</th><th>Commission</th><th>Cash after</th></tr></thead><tbody id="trades"></tbody></table></section>
</main><script>
const $=id=>document.getElementById(id), pct=v=>v==null?'—':(100*v).toFixed(2)+'%', num=v=>Number(v).toLocaleString(undefined,{maximumFractionDigits:2});
function payload(){let s=$('symbol').value.trim().toUpperCase(),f=+$('fast').value,l=+$('slow').value;let ref=id=>({kind:'indicator',id});return{strategy:{schema_version:'1.0',name:`${s} ${f}/${l} SMA crossover`,symbols:[s],frequency:'1d',direction:'long_only',indicators:[{type:'sma',id:'fast',source:'close',window:f},{type:'sma',id:'slow',source:'close',window:l}],entry_conditions:[{type:'crossover',left:ref('fast'),operator:'crosses_above',right:ref('slow')}],exit_conditions:[{type:'crossover',left:ref('fast'),operator:'crosses_below',right:ref('slow')}],position_sizing:{type:'all_in',cash_buffer_fraction:+$('buffer').value/100,allow_fractional_shares:$('fractional').value==='true'},execution:{signal_price:'close',execution_bar:'next_bar',execution_price:'open'}},backtest:{start_date:$('start').value,end_date:$('end').value,starting_capital:+$('capital').value,costs:{commission_type:'fixed_per_order',commission_amount:+$('commission').value,slippage_bps:+$('slippage').value}},requested_data_provider:$('provider').value}}
function metrics(b){let m=b.analysis.strategy_metrics,x=b.analysis.benchmark_metrics,rows=[['Return',pct(m.total_return),pct(x.total_return)],['CAGR',pct(m.cagr),pct(x.cagr)],['Volatility',pct(m.annualized_volatility),pct(x.annualized_volatility)],['Sharpe',m.sharpe_ratio?.toFixed(2)??'—',x.sharpe_ratio?.toFixed(2)??'—'],['Drawdown',pct(m.max_drawdown),pct(x.max_drawdown)],['Trades',m.number_of_trades,b.execution.trades.length+' fills']];$('metrics').innerHTML=rows.map(r=>`<div class="metric"><small>${r[0]}</small><b>${r[1]}</b><small>Benchmark ${r[2]}</small></div>`).join('');$('results').hidden=false}
function trades(ts){$('trades').innerHTML=ts.map(t=>`<tr><td>${t.side}</td><td>${new Date(t.execution_timestamp).toLocaleDateString()}</td><td>${num(t.fill_price)}</td><td>${num(t.quantity)}</td><td>${num(t.commission)}</td><td>${num(t.cash_after)}</td></tr>`).join('')||'<tr><td colspan=6>No trades</td></tr>';$('tradebox').hidden=false}
function chart(a,b){let c=$('chart'),w=c.clientWidth||900,h=320,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;let g=c.getContext('2d');g.scale(d,d);let vals=[...a,...b].map(p=>p.equity),lo=Math.min(...vals),hi=Math.max(...vals);if(hi===lo)hi++;let pad=35,X=(i,n)=>pad+i*(w-2*pad)/Math.max(n-1,1),Y=v=>pad+(hi-v)*(h-2*pad)/(hi-lo),line=(s,color)=>{g.strokeStyle=color;g.beginPath();s.forEach((p,i)=>i?g.lineTo(X(i,s.length),Y(p.equity)):g.moveTo(X(i,s.length),Y(p.equity)));g.stroke()};line(b,'#888');line(a,'#111827');$('chartbox').hidden=false}
$('backtest-form').onsubmit=async e=>{e.preventDefault();$('run').disabled=true;$('status').className='';$('status').textContent='Running…';try{let r=await fetch('/api/v1/backtests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())}),b=await r.json();if(!r.ok)throw Error(typeof b.detail==='string'?b.detail:JSON.stringify(b.detail));metrics(b);trades(b.execution.trades);chart(b.execution.equity_curve,b.analysis.benchmark.equity_curve);$('status').textContent=`Completed using ${b.data_provider}. ${b.execution.equity_curve.length} observations.`}catch(err){$('status').className='error';$('status').textContent='Backtest failed: '+err.message}finally{$('run').disabled=false}};
</script></body></html>
